<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT4409 - Danh sách bài tập</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #24211f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff8ef, #f1dfca);
    }

    main {
      width: min(680px, 100%);
      padding: 40px;
      border: 1px solid #e1cdb7;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 50px rgba(70, 44, 24, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      color: #6f2d24;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 0 28px;
      color: #695f57;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
      gap: 16px;
    }

    a {
      display: block;
      padding: 22px;
      border: 1px solid #dfbfa4;
      border-radius: 14px;
      color: #6f2d24;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      background: #fffaf5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(111, 45, 36, 0.15);
    }

    a span {
      display: block;
      margin-top: 6px;
      color: #89776a;
      font-size: 0.9rem;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <main>
    <h1>IT4409</h1>
    <p>Chọn bài tập muốn xem:</p>

    <nav class="links" aria-label="Danh sách bài tập">
      <a href="./Bai2/index.html">
        Homework 4 - Bài 2
        <span>JSON tin tức và giỏ hàng</span>
      </a>
      <a href="./Bai3/index.html">
        Homework 4 - Bài 3
        <span>Thư viện ảnh, lọc và đăng tin nhanh</span>
      </a>
    </nav>
  </main>
</body>
</html>
